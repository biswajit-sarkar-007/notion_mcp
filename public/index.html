<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notion Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Notion Agent</h1>
      <button id="reset" type="button">Clear chat</button>
    </header>

    <div class="page">
      <input id="pageId" placeholder="Notion page ID" autocomplete="off" aria-label="Notion page ID">
      <button id="setPage" type="button">Set page</button>
    </div>

    <section id="log" aria-live="polite">
      <p class="empty">Set a page ID, then ask something like “Summarize this page”.</p>
    </section>

    <form id="form">
      <input id="input" placeholder="Ask about your page" autocomplete="off" aria-label="Message" required>
      <button type="submit" id="send">Send</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
